name: Lint GitHub Actions Workflows

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://docker.io/boxcutter/actionlint:1.7.12
        with:
          args: -color
